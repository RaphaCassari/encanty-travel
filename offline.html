<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - Viagens Orlando</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1e3a5f 0%, #2d5a87 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      text-align: center;
      padding: 20px;
    }
    
    .offline-container {
      max-width: 500px;
    }
    
    .offline-icon {
      font-size: 80px;
      margin-bottom: 24px;
      opacity: 0.9;
    }
    
    .offline-title {
      font-size: 2rem;
      font-weight: 600;
      margin-bottom: 16px;
    }
    
    .offline-message {
      font-size: 1.1rem;
      opacity: 0.9;
      margin-bottom: 32px;
      line-height: 1.6;
    }
    
    .offline-btn {
      display: inline-block;
      padding: 14px 32px;
      background: #f7931e;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 1rem;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      border: none;
      cursor: pointer;
    }
    
    .offline-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(247, 147, 30, 0.4);
    }
    
    .offline-tips {
      margin-top: 40px;
      padding-top: 24px;
      border-top: 1px solid rgba(255, 255, 255, 0.2);
    }
    
    .offline-tips h3 {
      font-size: 1rem;
      margin-bottom: 12px;
      opacity: 0.8;
    }
    
    .offline-tips ul {
      list-style: none;
      font-size: 0.9rem;
      opacity: 0.7;
    }
    
    .offline-tips li {
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <div class="offline-container">
    <div class="offline-icon">📡</div>
    <h1 class="offline-title">Você está offline</h1>
    <p class="offline-message">
      Parece que você perdeu a conexão com a internet. 
      Verifique sua conexão e tente novamente.
    </p>
    <button class="offline-btn" onclick="window.location.reload()">
      Tentar novamente
    </button>
    
    <div class="offline-tips">
      <h3>Dicas:</h3>
      <ul>
        <li>Verifique se o Wi-Fi está conectado</li>
        <li>Verifique se os dados móveis estão ativos</li>
        <li>Tente se aproximar do roteador</li>
      </ul>
    </div>
  </div>
</body>
</html>
